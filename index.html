<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تبلیغاتی سمکو</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
      padding: 30px;
    }
    h1 {
      font-size: 36px;
      color: #333;
      margin-bottom: 20px;
    }
    .logos {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .logos img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      cursor: pointer;
    }
    .address {
      font-size: 18px;
      color: #333;
      margin-top: 20px;
      margin-bottom: 40px;
    }
    .video-container {
      max-width: 640px;
      margin: 0 auto;
      background-color: #ccc;
      padding: 10px;
      border-radius: 10px;
      margin-top: 30px;
    }
    video {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
    .footer-text {
      font-size: 12px;
      color: #888;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>تبلیغاتی سمکو</h1>

  <div class="logos">
    <a href="https://www.instagram.com" target="_blank">
      <img src="instagram.png" alt="Instagram">
    </a>
    <a href="https://telegram.me" target="_blank">
      <img src="telegram.png" alt="Telegram">
    </a>
    <a href="https://wa.me/1234567890" target="_blank">
      <img src="whatsapp.png" alt="WhatsApp">
    </a>
    <a href="tel:+1234567890">
      <img src="phone.png" alt="Phone">
    </a>
  </div>

  <div class="address">
    آدرس: استان کردستان - شهرستان سقز - خیابان آزادی - کوچه یک - پلاک 2
  </div>

  <div class="video-container">
    <video controls>
      <source src="your-video.mp4" type="video/mp4">
      مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
    </video>
  </div>

  <div class="footer-text">
    ساخته شده در تبلیغاتی سمکو
  </div>

</body>
</html>
